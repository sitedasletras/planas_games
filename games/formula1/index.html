<!DOCTYPE html>
<html lang="pt-br">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4102102989530314" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WSP Fórmula 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
<style>
  .week-note {
    text-align: center;
    font-size: 0.72rem;
    color: #9fd8b8;
    padding: 0 24px;
  }
</style>
</head>
<body>
  <div class="landing-wrap">
    <div class="landing-topbar">
      <a class="back-btn" href="../../index.html">←</a>
      <h1>Fórmula 1</h1>
    </div>

    <div class="club-card">
      <div class="club-badge" id="club-badge">🏎️</div>
      <div class="club-name" id="club-name">Bandeirantes Racing</div>
    </div>

    <div class="landing-actions">
      <a class="action-btn primary" href="corrida.html" id="race-btn">
        <span class="action-icon">🏁</span>
        <span>Corrida</span>
      </a>
      <a class="action-btn" href="temporada.html">
        <span class="action-icon">🏆</span>
        <span>Temporada</span>
      </a>
      <a class="action-btn" href="pilotos.html">
        <span class="action-icon">🧑‍🚀</span>
        <span>Pilotos</span>
      </a>
      <a class="action-btn" href="escuderia.html">
        <span class="action-icon">🏎️</span>
        <span>Equipe</span>
      </a>
      <a class="action-btn" href="personalizacao.html">
        <span class="action-icon">🎨</span>
        <span>Personalização</span>
      </a>
    </div>

    <p class="week-note">Boa corrida! Passe pela Temporada pra ver o próximo final de semana de GP.</p>
  </div>

  <script src="pilotos.js"></script>
  <script src="equipe.js"></script>
  <script src="corrida.js"></script>
  <script src="grid.js"></script>
  <script src="calendario.js"></script>
  <script>
    if (window.WSPF1Pilotos) {
      document.getElementById('club-name').textContent = window.WSPF1Pilotos.loadSquad().teamName;
    }
    if (window.WSPF1Equipe) {
      const equipe = window.WSPF1Equipe.loadClub();
      const badge = document.getElementById('club-badge');
      badge.textContent = equipe.crest.emblem;
      badge.style.background = window.WSPF1Equipe.crestColor(equipe);
      badge.style.borderColor = equipe.colors.detail;
    }
  </script>
</body>
</html>
