<!DOCTYPE html>
<html lang="pt-br">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4102102989530314" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WSP Futebol</title>
<link rel="stylesheet" href="landing.css">
</head>
<body>
  <div class="landing-wrap">
    <div class="landing-topbar">
      <a class="back-btn" href="../../index.html">←</a>
      <h1>Futebol</h1>
    </div>

    <div class="club-card">
      <div class="club-badge" id="club-badge">⚫⚪</div>
      <div class="club-name" id="club-name">Bandeirantes</div>
    </div>

    <div class="landing-actions">
      <a class="action-btn primary" href="match.html">
        <span class="action-icon">▶</span>
        <span>Jogar</span>
      </a>
      <a class="action-btn" href="temporada.html">
        <span class="action-icon">🏆</span>
        <span>Temporada</span>
      </a>
      <a class="action-btn" href="escalacao.html">
        <span class="action-icon">📝</span>
        <span>Escalação</span>
      </a>
      <a class="action-btn" href="elenco.html">
        <span class="action-icon">📋</span>
        <span>Elenco</span>
      </a>
      <a class="action-btn" href="clube.html">
        <span class="action-icon">🏟️</span>
        <span>Clube</span>
      </a>
      <a class="action-btn" href="historico.html">
        <span class="action-icon">🏆</span>
        <span>Histórico</span>
      </a>
      <a class="action-btn" href="personalizacao.html">
        <span class="action-icon">🎨</span>
        <span>Personalização</span>
      </a>
      <a class="action-btn" href="backup.html">
        <span class="action-icon">💾</span>
        <span>Salvar / Carregar</span>
      </a>
    </div>
  </div>

  <div class="daily-overlay hidden" id="daily-overlay">
    <div class="daily-card">
      <div class="daily-title">Recompensa diária</div>
      <div class="daily-day" id="daily-day">Dia 1</div>
      <div class="daily-coin">💰</div>
      <div class="daily-amount" id="daily-amount">R$ 500</div>
      <button class="action-btn primary" id="daily-claim-btn">Resgatar</button>
    </div>
  </div>

  <script src="squad.js"></script>
  <script src="club.js"></script>
  <script src="daily.js"></script>
  <script>
    if (window.WSPSquad) {
      document.getElementById('club-name').textContent = window.WSPSquad.loadSquad().clubName;
    }
    if (window.WSPClub) {
      const club = window.WSPClub.loadClub();
      const badge = document.getElementById('club-badge');
      badge.textContent = club.crest.emblem;
      badge.style.background = club.colors.primary;
      badge.style.borderColor = club.colors.detail;
    }
    if (window.WSPDaily) {
      const reward = window.WSPDaily.checkReward();
      if (reward.available) {
        const overlay = document.getElementById('daily-overlay');
        document.getElementById('daily-day').textContent = 'Dia ' + reward.day;
        document.getElementById('daily-amount').textContent = 'R$ ' + reward.amount.toLocaleString('pt-BR');
        overlay.classList.remove('hidden');
        document.getElementById('daily-claim-btn').addEventListener('click', () => {
          window.WSPDaily.claimReward();
          overlay.classList.add('hidden');
        });
      }
    }
  </script>
</body>
</html>
