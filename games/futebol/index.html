<!DOCTYPE html>
<html lang="pt-br">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4102102989530314" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WSP Futebol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
</head>
<body>
  <div class="landing-wrap">
    <div class="landing-topbar">
      <a class="back-btn" href="../../index.html">←</a>
      <h1>Futebol</h1>
    </div>

    <div class="club-card">
      <div class="club-badge" id="club-badge">⚫⚪</div>
      <div class="club-name" id="club-name">Bandeirantes</div>
    </div>

    <div class="landing-actions">
      <a class="action-btn primary" href="match.html" id="play-btn">
        <span class="action-icon">▶</span>
        <span id="play-btn-label">Jogar</span>
      </a>
      <a class="action-btn" href="temporada.html">
        <span class="action-icon">🏆</span>
        <span>Temporada</span>
      </a>
      <a class="action-btn" href="escalacao.html">
        <span class="action-icon">📝</span>
        <span>Escalação</span>
      </a>
      <a class="action-btn" href="elenco.html">
        <span class="action-icon">📋</span>
        <span>Elenco</span>
      </a>
      <a class="action-btn" href="clube.html">
        <span class="action-icon">🏟️</span>
        <span>Clube</span>
      </a>
      <a class="action-btn" href="historico.html">
        <span class="action-icon">🏆</span>
        <span>Histórico</span>
      </a>
      <a class="action-btn" href="trilha.html">
        <span class="action-icon">🎯</span>
        <span>Patrocinador Especial</span>
      </a>
      <a class="action-btn" href="personalizacao.html">
        <span class="action-icon">🎨</span>
        <span>Personalização</span>
      </a>
      <a class="action-btn" href="backup.html">
        <span class="action-icon">💾</span>
        <span>Salvar / Carregar</span>
      </a>
    </div>
  </div>

  <div class="daily-overlay hidden" id="daily-overlay">
    <div class="daily-card">
      <div class="daily-title">Recompensa diária</div>
      <div class="daily-day" id="daily-day">Dia 1</div>
      <div class="daily-coin">💰</div>
      <div class="daily-amount" id="daily-amount">R$ 500</div>
      <button class="action-btn primary" id="daily-claim-btn">Resgatar</button>
    </div>
  </div>

  <script src="squad.js"></script>
  <script src="club.js"></script>
  <script src="daily.js"></script>
  <script src="calendario.js"></script>
  <script src="presidente.js"></script>
  <script>
    function startHubTour() {
      if (window.WSPTour) {
        window.WSPTour.runTour('hub', [
          'Olá! Eu cuido da presidência do clube e vou te ajudar a conhecer o jogo. Sempre que tiver dúvida, é só tocar no botão ❓ no canto da tela.',
          "No menu principal: 'Jogar' entra direto numa partida, e 'Temporada' te leva pro campeonato com ligas e copas de verdade.",
          "'Escalação' é onde você monta o time titular, e 'Elenco' é onde você contrata e gerencia os jogadores.",
          "'Clube' é o coração da gestão: Campus, patrocínios, calendário da próxima partida e as atividades entre os jogos — Treino, Médico e Diretoria.",
          'As outras opções guardam seu histórico de títulos, a trilha de recompensas, a personalização do escudo/uniforme e o backup dos seus dados. Boa sorte!',
        ]);
      }
    }

    if (window.WSPCalendar) {
      const cal = window.WSPCalendar.loadCalendar();
      if (!window.WSPCalendar.isMatchAvailable(cal)) {
        const playBtn = document.getElementById('play-btn');
        const playLabel = document.getElementById('play-btn-label');
        playBtn.href = 'clube.html';
        playLabel.textContent = 'Próxima partida: ' + window.WSPCalendar.formatCountdown(window.WSPCalendar.msUntilNextMatch(cal));
      }
    }
    if (window.WSPSquad) {
      document.getElementById('club-name').textContent = window.WSPSquad.loadSquad().clubName;
    }
    if (window.WSPClub) {
      const club = window.WSPClub.loadClub();
      const badge = document.getElementById('club-badge');
      badge.textContent = club.crest.emblem;
      badge.style.background = window.WSPClub.crestColor(club);
      badge.style.borderColor = club.colors.detail;
    }
    if (window.WSPDaily) {
      const reward = window.WSPDaily.checkReward();
      if (reward.available) {
        const overlay = document.getElementById('daily-overlay');
        document.getElementById('daily-day').textContent = 'Dia ' + reward.day;
        document.getElementById('daily-amount').textContent = 'R$ ' + reward.amount.toLocaleString('pt-BR');
        overlay.classList.remove('hidden');
        document.getElementById('daily-claim-btn').addEventListener('click', () => {
          window.WSPDaily.claimReward();
          overlay.classList.add('hidden');
          startHubTour();
        });
      } else {
        startHubTour();
      }
    } else {
      startHubTour();
    }
  </script>
</body>
</html>
