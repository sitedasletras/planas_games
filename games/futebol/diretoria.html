<!DOCTYPE html>
<html lang="pt-br">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4102102989530314" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WSP Diretoria</title>
<link rel="stylesheet" href="elenco.css">
<link rel="stylesheet" href="diretoria.css">
</head>
<body>
  <div class="elenco-wrap">
    <div class="elenco-topbar">
      <a class="back-btn" href="clube.html">←</a>
      <h1>Reunião de Diretoria</h1>
    </div>

    <div class="report-card">
      <div class="report-title">📊 Relatório do Clube</div>
      <div class="report-grid" id="report-grid"></div>
    </div>

    <div class="board-card" id="board-card">
      <div class="board-quote" id="board-quote"></div>
      <button class="board-action-btn" id="board-action-btn"></button>
      <div class="board-priority hidden" id="board-priority">
        <div class="board-priority-title">O que a diretoria deve priorizar agora?</div>
        <div class="board-priority-options" id="board-priority-options"></div>
      </div>
    </div>
  </div>

  <script src="squad.js"></script>
  <script src="club.js"></script>
  <script src="season.js"></script>
  <script src="calendario.js"></script>
  <script src="diretoria.js"></script>
  <script src="presidente.js"></script>
  <script>
    if (window.WSPTour) {
      window.WSPTour.runTour('diretoria', [
        'O relatório mostra a saúde geral do clube: caixa, moral do elenco, último resultado e a situação do Campus.',
        "Ao ouvir a diretoria, você recebe uma verba de apoio e pode escolher uma área pra priorizar — a escolhida ganha desconto na próxima melhoria.",
      ]);
    }
  </script>
</body>
</html>
