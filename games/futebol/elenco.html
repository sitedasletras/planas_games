<!DOCTYPE html>
<html lang="pt-br">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4102102989530314" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WSP Elenco</title>
<link rel="stylesheet" href="elenco.css">
</head>
<body>
  <div class="elenco-wrap">
    <div class="elenco-topbar">
      <a class="back-btn" href="index.html">←</a>
      <h1 id="club-name">Elenco</h1>
      <span class="budget-pill" id="budget-pill">R$ 0</span>
    </div>

    <div class="squad-size-hint hidden" id="squad-size-hint"></div>

    <div class="market-card">
      <div class="market-header">
        <span>Mercado de Contratações</span>
        <button class="reroll-btn" id="market-reroll" title="Ver outros candidatos">🔄</button>
      </div>
      <div class="market-list" id="market-list"></div>
    </div>

    <div class="elenco-sections" id="elenco-sections"></div>
  </div>

  <script src="squad.js"></script>
  <script src="club.js"></script>
  <script src="elenco.js"></script>
  <script src="presidente.js"></script>
  <script>
    if (window.WSPTour) {
      window.WSPTour.runTour('elenco', [
        'Aqui você acompanha todo o elenco, agrupado por posição — nota, potencial, idade e características de cada jogador.',
        'O Mercado de Contratações no topo mostra candidatos disponíveis; toque em 🔄 pra ver outras opções, e contrate quem encaixar no orçamento.',
        'Jogadores jovens com bom potencial evoluem com o Treino — vale sempre dar uma olhada nas promessas do elenco.',
      ]);
    }
  </script>
</body>
</html>
