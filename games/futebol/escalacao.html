<!DOCTYPE html>
<html lang="pt-br">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4102102989530314" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WSP Escalação</title>
<link rel="stylesheet" href="elenco.css">
<link rel="stylesheet" href="escalacao.css">
</head>
<body>
  <div class="elenco-wrap">
    <div class="elenco-topbar">
      <a class="back-btn" href="index.html">←</a>
      <h1>Escalação</h1>
    </div>

    <div class="formation-badge" id="formation-badge">4-3-3</div>

    <div class="formation-picker" id="formation-picker">
      <div class="formation-picker-title">Monte seu esquema</div>
      <div class="formation-steppers" id="formation-steppers"></div>
      <div class="formation-total" id="formation-total"></div>
    </div>

    <div class="elenco-sections" id="lineup-sections"></div>

    <div class="elenco-sections" id="bench-sections">
      <div class="elenco-section">
        <h2>Banco / Reservas</h2>
        <div id="bench-list"></div>
      </div>
    </div>

    <div class="lineup-footer">
      <button class="action-btn primary" id="save-lineup-btn" style="width:100%;border:none;font:inherit;">
        <span class="action-icon">💾</span>
        <span>Salvar Escalação</span>
      </button>
      <a class="action-btn" href="match.html" style="margin-top:8px;">
        <span class="action-icon">▶</span>
        <span>Entrar em Campo</span>
      </a>
    </div>
  </div>

  <div class="overlay hidden" id="picker-overlay">
    <div class="overlay-card instructions-card">
      <div class="overlay-title" style="font-size:1.1rem;" id="picker-title">Escolher jogador</div>
      <div class="picker-list" id="picker-list"></div>
      <button class="overlay-btn" id="picker-close">Fechar</button>
    </div>
  </div>

  <script src="squad.js"></script>
  <script src="escalacao.js"></script>
</body>
</html>
