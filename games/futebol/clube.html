<!DOCTYPE html>
<html lang="pt-br">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4102102989530314" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WSP Clube</title>
<link rel="stylesheet" href="clube.css">
</head>
<body>
  <div class="clube-wrap">
    <div class="clube-topbar">
      <a class="back-btn" href="index.html">←</a>
      <h1>Clube</h1>
    </div>

    <div class="budget-card">
      <span class="budget-label">Caixa do clube</span>
      <span class="budget-value" id="budget-value">R$ 0</span>
    </div>

    <div class="calendar-card" id="calendar-card">
      <span class="calendar-label" id="calendar-label">Próxima partida</span>
      <span class="calendar-value" id="calendar-value">Disponível agora</span>
      <a class="calendar-play-btn hidden" id="calendar-play-btn" href="index.html">▶ Ir jogar</a>
    </div>

    <div id="news-section" class="hidden">
      <h2 class="section-title">Notícias</h2>
      <div class="news-list" id="news-list"></div>
    </div>

    <h2 class="section-title">Campus</h2>
    <div class="campus-tier-note" id="campus-tier-note"></div>
    <div class="dept-list" id="dept-list"></div>

    <h2 class="section-title">Patrocínios</h2>
    <div class="dept-list" id="sponsor-list"></div>
  </div>

  <script src="club.js"></script>
  <script src="season.js"></script>
  <script src="calendario.js"></script>
  <script src="clube.js"></script>
</body>
</html>
