<!DOCTYPE html>
<html lang="pt-br">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4102102989530314" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WSP Clube</title>
<link rel="stylesheet" href="clube.css">
</head>
<body>
  <div class="clube-wrap">
    <div class="clube-topbar">
      <a class="back-btn" href="index.html">←</a>
      <h1>Clube</h1>
    </div>

    <div class="budget-card">
      <span class="budget-label">Caixa do clube</span>
      <span class="budget-value" id="budget-value">R$ 0</span>
    </div>

    <div class="morale-card">
      <span class="budget-label">Moral do elenco</span>
      <div class="morale-bar-wrap">
        <div class="level-track"><div class="level-fill" id="morale-fill"></div></div>
        <span class="morale-value" id="morale-value">Neutra</span>
      </div>
    </div>

    <div class="calendar-card" id="calendar-card">
      <span class="calendar-label" id="calendar-label">Próxima partida</span>
      <span class="calendar-value" id="calendar-value">Disponível agora</span>
      <a class="calendar-play-btn hidden" id="calendar-play-btn" href="index.html">▶ Ir jogar</a>
      <button class="calendar-ad-btn hidden" id="calendar-ad-btn">🎬 Assistir vídeo — adiantar 1 dia</button>
    </div>

    <div id="news-section" class="hidden">
      <h2 class="section-title">Notícias</h2>
      <div class="news-list" id="news-list"></div>
    </div>

    <h2 class="section-title">Atividades</h2>
    <div class="activities-row">
      <a class="activity-btn" href="treino.html"><span class="activity-icon">🏋️</span><span>Treino</span></a>
      <a class="activity-btn" href="medico.html" id="activity-medico"><span class="activity-icon">⚕️</span><span>Médico</span></a>
      <a class="activity-btn" href="diretoria.html"><span class="activity-icon">🏛️</span><span>Diretoria</span></a>
    </div>

    <h2 class="section-title">Campus</h2>
    <div class="campus-tier-note" id="campus-tier-note"></div>
    <div class="dept-list" id="dept-list"></div>

    <h2 class="section-title">Patrocínios</h2>
    <div class="dept-list" id="sponsor-list"></div>
  </div>

  <div class="ad-overlay hidden" id="ad-overlay">
    <div class="ad-card">
      <div class="ad-title">🎬 Anúncio</div>
      <div class="ad-sub" id="ad-sub">Carregando vídeo...</div>
      <div class="ad-bar-track"><div class="ad-bar-fill" id="ad-bar-fill"></div></div>
      <button class="ad-close-btn hidden" id="ad-close-btn">Resgatar recompensa</button>
    </div>
  </div>

  <script src="squad.js"></script>
  <script src="club.js"></script>
  <script src="season.js"></script>
  <script src="calendario.js"></script>
  <script src="clube.js"></script>
  <script src="presidente.js"></script>
  <script>
    if (window.WSPTour) {
      window.WSPTour.runTour('clube', [
        'Esse é o painel do clube. Aqui em cima você vê o caixa e a moral do elenco — ela sobe ou desce conforme suas respostas na entrevista coletiva depois de cada partida.',
        'O calendário mostra quando a próxima partida libera. Enquanto espera, aproveite as atividades: Treino, Médico e Diretoria.',
        'Mais abaixo fica o Campus, onde você melhora os departamentos do clube, e os Patrocínios, que trazem receita extra.',
      ]);
    }
  </script>
</body>
</html>
