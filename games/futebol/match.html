<!DOCTYPE html>
<html lang="pt-br">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4102102989530314" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WSP Futebol</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrap">
    <div class="center-col">
      <div class="topbar">
        <a class="back-btn" href="index.html">←</a>
        <div class="score-panel">
          <span class="team-tag home" id="team-tag-home">B</span>
          <span id="score-home">0</span>
          <span class="dash">-</span>
          <span id="score-away">0</span>
          <span class="team-tag away">A</span>
        </div>
        <div class="timer"><span id="half-label">1T</span> <span id="timer">00:00</span></div>
        <div class="controls-top">
          <button id="btn-subs" title="Substituições">🔄</button>
          <button id="btn-instructions" title="Instruções">👤</button>
          <button id="btn-tactics" title="Tática">📋</button>
          <button id="btn-speed" title="Acelerar">⏩</button>
          <button id="btn-pause" title="Pausar">⏸</button>
        </div>
      </div>

      <div class="pressure-bar" id="pressure-bar">
        <div class="pressure-fill-home" id="pressure-fill-home"></div>
        <div class="pressure-fill-away" id="pressure-fill-away"></div>
        <span class="pressure-label-home" id="pressure-label-home">50%</span>
        <span class="pressure-label-away" id="pressure-label-away">50%</span>
      </div>

      <button class="ticker" id="ticker" title="Ver narração completa">📢 Bola rolando...</button>

      <div class="sponsor-strip hidden" id="sponsor-strip"></div>

      <div class="crowd-strip" id="crowd-strip"></div>

      <canvas id="field" width="400" height="759"></canvas>

      <div class="duel-popup hidden" id="duel-popup">
        <div class="duel-card">
          <div class="duel-player" id="duel-player-a">
            <div class="duel-name" id="duel-name-a"></div>
            <div class="duel-rating" id="duel-rating-a"></div>
          </div>
          <div class="duel-vs">⚔️</div>
          <div class="duel-player" id="duel-player-b">
            <div class="duel-name" id="duel-name-b"></div>
            <div class="duel-rating" id="duel-rating-b"></div>
          </div>
        </div>
        <div class="duel-result" id="duel-result"></div>
      </div>

      <div class="overlay hidden" id="overlay">
        <div class="overlay-card">
          <div class="overlay-title" id="overlay-title">GOL!</div>
          <div class="overlay-sub" id="overlay-sub"></div>
          <canvas class="replay-canvas hidden" id="replay-canvas" width="300" height="160"></canvas>
          <div class="break-actions hidden" id="break-actions">
            <button class="break-action-btn" id="break-tactics-btn">📋 Tática</button>
            <button class="break-action-btn" id="break-instructions-btn">👤 Instruções</button>
            <button class="break-action-btn" id="break-subs-btn">🔄 Substituições</button>
          </div>
          <div class="ratings-section hidden" id="ratings-section">
            <div class="ratings-team" id="ratings-team"></div>
            <div class="ratings-list" id="ratings-list"></div>
          </div>
          <button class="overlay-btn hidden" id="overlay-restart">Jogar novamente</button>
        </div>
      </div>

      <div class="overlay hidden" id="press-overlay">
        <div class="overlay-card">
          <div class="overlay-title" style="font-size:1.15rem;">🎙️ Coletiva de Imprensa</div>
          <div class="overlay-sub" id="press-question"></div>
          <div class="press-answers" id="press-answers"></div>
          <div class="press-reaction hidden" id="press-reaction"></div>
          <button class="overlay-btn hidden" id="press-continue-btn">Ir para o Clube</button>
        </div>
      </div>

      <div class="overlay hidden" id="tactics-overlay">
        <div class="overlay-card">
          <div class="overlay-title" style="font-size:1.3rem;">Escolha a tática</div>
          <div class="tactics-list" id="tactics-list"></div>
          <button class="overlay-btn" id="tactics-close">Fechar</button>
        </div>
      </div>

      <div class="overlay hidden" id="instructions-overlay">
        <div class="overlay-card instructions-card">
          <div class="overlay-title" style="font-size:1.15rem;">Instruções por jogador</div>
          <div class="instructions-list" id="instructions-list"></div>
          <button class="overlay-btn" id="instructions-close">Fechar</button>
        </div>
      </div>

      <div class="overlay hidden" id="subs-overlay">
        <div class="overlay-card instructions-card">
          <div class="overlay-title" style="font-size:1.15rem;">Substituições</div>
          <div class="subs-counter" id="subs-counter">0/5 usadas</div>
          <div class="subs-hint" id="subs-hint">Toque em quem sai, depois em quem entra</div>
          <div class="subs-columns">
            <div class="subs-col">
              <div class="subs-col-title">Em campo</div>
              <div class="instructions-list" id="subs-onfield"></div>
            </div>
            <div class="subs-col">
              <div class="subs-col-title">Banco</div>
              <div class="instructions-list" id="subs-bench"></div>
            </div>
          </div>
          <button class="overlay-btn" id="subs-close">Fechar</button>
        </div>
      </div>

      <div class="overlay hidden" id="narration-overlay">
        <div class="overlay-card instructions-card">
          <div class="overlay-title" style="font-size:1.15rem;">Narração da partida</div>
          <div class="narration-list" id="narration-list"></div>
          <button class="overlay-btn" id="narration-close">Fechar</button>
        </div>
      </div>
    </div>

    <div class="side-panel" id="side-panel">
      <div class="side-panel-title">Instruções rápidas</div>
      <div class="side-panel-hint">Ajuste sem pausar o jogo</div>
      <div class="side-instructions-list" id="side-instructions-list"></div>
    </div>
  </div>

  <script src="squad.js"></script>
  <script src="club.js"></script>
  <script src="trilha.js"></script>
  <script src="calendario.js"></script>
  <script src="game.js"></script>
  <script src="presidente.js"></script>
  <script>
    if (window.WSPTour && (!window.WSPCalendar || window.WSPCalendar.isMatchAvailable(window.WSPCalendar.loadCalendar()))) {
      // pausa a partida enquanto o tour está na tela, pra não perder nada
      // do jogo lendo as dicas — e retoma sozinho quando ele fecha
      let tourPausedMatch = false;
      window.WSPTour.runTour('partida', [
        'Durante a partida você pode pausar, acelerar, trocar a tática, dar instruções pros jogadores e fazer substituições — os botões ficam aqui em cima.',
        'Se um jogador se machucar ou levar cartão, isso pode valer pra além dessa partida — de olho no Médico depois do jogo!',
        'No fim da partida tem a entrevista coletiva: suas respostas mudam a moral do elenco. Boa sorte em campo!',
      ], {
        onOpen: () => {
          const btn = document.getElementById('btn-pause');
          if (btn && btn.textContent === '⏸') { btn.click(); tourPausedMatch = true; }
        },
        onFinish: () => {
          const btn = document.getElementById('btn-pause');
          if (btn && tourPausedMatch) { btn.click(); tourPausedMatch = false; }
        },
      });
    }
  </script>
</body>
</html>
